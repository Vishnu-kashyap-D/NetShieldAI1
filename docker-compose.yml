# Dashboard http://localhost:8080  ·  API http://localhost:8000
# Secrets come from a .env file next to this one (copy .env.example; .env is git-ignored).
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: netshield
      MYSQL_USER: netshield
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: netshield
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: netshield
      # Must match the dashboard's address exactly: it drives both CORS and the CSRF Origin check.
      CORS_ORIGINS: '["http://localhost:8080"]'
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # UNKNOWN_CONFIDENCE_THRESHOLD: "0.9"   # optional "Unknown" abstention, see docs/PHASE6_FINDINGS.md
    ports:
      - "8000:8000"
    volumes:
      - artifacts:/app/artifacts
      - reports:/app/reports
      - feedback:/app/data/feedback
      # Only needed if you want the Retraining page to work (it trains on the CICIDS2017 CSVs):
      # - ./MachineLearningCVE:/app/MachineLearningCVE:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  dbdata:
  artifacts:
  reports:
  feedback:
